<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI-Assisted SDR Design — Methodology Atlas</title>
<meta name="description" content="Interactive, research-backed atlas comparing the AI-Assisted SDR Design methodologies defined in the golden reference.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Saira+Semi+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F6F8; --surface:#FFFFFF; --surface-2:#EAEEF2; --ink:#16202B; --ink-2:#4A5563; --rule:#CBD3DC;
  --phase:#2458A6; --decision:#A86400; --output:#2C7A4B; --loop:#9B2F7F; --artifact:#5E6B78;
  --focus:#1B62D6; --grid:rgba(36,88,166,.07); --mark:#FFE9A8; --shadow:0 10px 30px rgba(22,32,43,.16);
  --font-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --font-head:"Saira Semi Condensed","Arial Narrow","Segoe UI",system-ui,sans-serif;
  --font-code:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E141B; --surface:#151D26; --surface-2:#1C2632; --ink:#E4EAF0; --ink-2:#A7B3C0; --rule:#2E3B4A;
    --phase:#86ADF0; --decision:#E4A94E; --output:#74CC98; --loop:#E583C9; --artifact:#9DAAB7;
    --focus:#8FB6FF; --grid:rgba(134,173,240,.07); --mark:#5A4A12; --shadow:0 10px 30px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E141B; --surface:#151D26; --surface-2:#1C2632; --ink:#E4EAF0; --ink-2:#A7B3C0; --rule:#2E3B4A;
  --phase:#86ADF0; --decision:#E4A94E; --output:#74CC98; --loop:#E583C9; --artifact:#9DAAB7;
  --focus:#8FB6FF; --grid:rgba(134,173,240,.07); --mark:#5A4A12; --shadow:0 10px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px);scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*,*::before,*::after{transition:none!important;animation:none!important}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4{font-family:var(--font-head);line-height:1.12;margin:0;letter-spacing:-.005em}
h2{font-size:clamp(1.6rem,2.4vw,2rem);font-weight:700}
h3{font-size:1.25rem;font-weight:600}
h4{font-size:1.02rem;font-weight:600}
p{margin:0 0 .8em}
a{color:var(--phase);text-underline-offset:2px}
a:hover{text-decoration-thickness:2px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:-1px;padding:0;border:0}
.skip{position:absolute;left:-9999px;top:8px;z-index:200;background:var(--surface);padding:10px 14px;border:2px solid var(--focus);border-radius:6px}
.skip:focus{left:12px}
code,kbd,pre{font-family:var(--font-code)}
sub{font-size:.72em}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100%}
.sidebar{position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;border-right:1px solid var(--rule);background:var(--surface);padding:20px 16px 28px}
.brand{font-family:var(--font-head);font-weight:700;font-size:1.08rem;line-height:1.15;margin:0 0 14px;padding:0 8px}
.brand span{display:block;font-family:var(--font-body);font-weight:400;font-size:.8rem;color:var(--ink-2);margin-top:4px}
.nav-group{margin:14px 0 4px;padding:0 8px;font-size:.78rem;color:var(--ink-2);font-weight:700}
.nav a{display:flex;gap:10px;align-items:baseline;padding:6px 8px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:.92rem;line-height:1.3}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="true"]{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--phase)}
.nav a.dim{opacity:.45}
.nav .num{font-family:var(--font-head);font-weight:700;min-width:1.4em;color:var(--phase)}
.main{min-width:0}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--paper);background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid var(--rule)}
.topbar-in{display:flex;gap:12px;align-items:center;max-width:1240px;margin:0 auto;padding:10px 32px}
.menu-btn{display:none}
.search{position:relative;flex:1;max-width:560px}
.search input{width:100%;font:inherit;padding:9px 12px 9px 36px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);color:var(--ink)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--ink-2)}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;padding:6px;z-index:50}
.results button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:8px 10px;cursor:pointer}
.results button:hover,.results button:focus-visible{background:var(--surface-2)}
.results .r-h{font-weight:700;font-size:.88rem}
.results .r-f{color:var(--ink-2);font-size:.8rem}
.results .r-s{font-size:.86rem;color:var(--ink-2);display:block;margin-top:2px}
.results .r-empty{padding:10px;color:var(--ink-2);font-size:.9rem}
mark{background:var(--mark);color:inherit;padding:0 1px;border-radius:2px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:.9rem;min-height:40px;line-height:1.2}
.btn:hover{border-color:var(--ink-2)}
.btn[aria-pressed="true"]{border-color:var(--phase);box-shadow:inset 0 0 0 1px var(--phase)}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}
.sec{padding:52px 0 44px;border-top:1px solid var(--rule)}
.sec-head{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;justify-content:space-between;margin-bottom:18px}
.sec-intro{max-width:74ch;color:var(--ink-2);margin:6px 0 20px}
.prose{max-width:74ch}

/* ---------- hero ---------- */
.hero{padding:44px 0 36px}
.hero h1{font-size:clamp(2.2rem,4.6vw,3.6rem);font-weight:700;max-width:18ch;letter-spacing:-.015em}
.hero .lead{font-size:1.14rem;max-width:62ch;margin:16px 0 22px;color:var(--ink-2)}
.defn{margin:0 0 26px;padding:16px 20px;border-left:4px solid var(--ink);background:var(--surface);border-radius:0 8px 8px 0;max-width:80ch;font-size:1.02rem}
.defn footer{font-size:.84rem;color:var(--ink-2);margin-top:8px}
.axis-note{display:flex;flex-wrap:wrap;gap:10px 24px;font-size:.9rem;color:var(--ink-2);margin:0 0 12px}
.lc-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
.lc{border-collapse:separate;border-spacing:0;width:100%;min-width:860px;font-size:.84rem}
.lc th,.lc td{padding:0;border-bottom:1px solid var(--rule)}
.lc thead th{font-family:var(--font-head);font-weight:600;font-size:.8rem;padding:10px 4px;text-align:center;color:var(--ink-2);vertical-align:bottom;line-height:1.1}
.lc tbody th{text-align:left;padding:6px 12px;white-space:nowrap;font-weight:400}
.lc tbody th button{background:none;border:0;cursor:pointer;padding:4px 0;text-align:left;display:flex;gap:8px;align-items:baseline}
.lc tbody th button:hover .nm{text-decoration:underline}
.lc .nm{font-weight:700}
.lc td{height:36px;padding:6px 3px}
.lc .cell{height:22px;border-radius:3px}
.lc .p{background:var(--phase)}
.lc .t{background:repeating-linear-gradient(135deg,var(--phase) 0 2px,transparent 2px 7px);box-shadow:inset 0 0 0 1.5px var(--phase)}
.lc tr:last-child th,.lc tr:last-child td{border-bottom:0}
.lc-legend{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:.84rem;color:var(--ink-2);margin-top:10px;align-items:center}
.sw{display:inline-block;width:26px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:6px}
.prov-legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 24px;margin-top:26px;font-size:.9rem}
.prov-legend div{padding-top:10px;border-top:2px solid var(--rule)}

/* ---------- provenance + citations ---------- */
.pv{display:inline-block;font-family:var(--font-body);font-size:.68rem;font-weight:700;line-height:1;padding:3px 5px;border-radius:4px;border:1px solid currentColor;margin:0 2px;vertical-align:1px;white-space:nowrap}
.pv-GR{color:var(--ink)}
.pv-INT{color:var(--loop)}
.pv-EX{color:var(--output)}
.pv-EXT{color:var(--phase)}
.cite{background:none;border:0;color:var(--phase);cursor:pointer;font-size:.74em;font-weight:700;padding:2px 2px;vertical-align:super;line-height:1}
.cite:hover{text-decoration:underline}
.popover{position:absolute;z-index:120;width:min(360px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);padding:14px 16px;font-size:.9rem}
.popover h4{margin:0 0 6px;font-size:1rem}
.popover .meta{color:var(--ink-2);font-size:.82rem;margin-bottom:8px}
.popover .x{position:absolute;right:6px;top:6px;border:0;background:none;cursor:pointer;width:32px;height:32px;border-radius:6px;font-size:1.1rem}
.popover .x:hover{background:var(--surface-2)}

/* ---------- chips / filters ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.88rem;cursor:pointer;min-height:36px}
.chip input{accent-color:var(--phase);width:16px;height:16px;margin:0}
.chip:has(input:checked){border-color:var(--phase);box-shadow:inset 0 0 0 1px var(--phase)}
.chip:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.lvl{display:inline-block;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--rule);color:var(--ink-2);white-space:nowrap}

/* ---------- tables ---------- */
.tbl-wrap{overflow:auto;border:1px solid var(--rule);border-radius:10px;background:var(--surface);max-width:100%}
.tbl-wrap.tall{max-height:78vh}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:.88rem}
table.t th,table.t td{padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:top;text-align:left}
table.t thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);font-family:var(--font-head);font-weight:600;font-size:.92rem}
table.t tbody tr:last-child td,table.t tbody tr:last-child th{border-bottom:0}
table.t .sc{position:sticky;left:0;z-index:1;background:var(--surface);font-weight:700;min-width:170px;box-shadow:1px 0 0 var(--rule)}
table.t thead .sc{z-index:3;background:var(--surface-2)}
table.t.wide td{min-width:230px}
table.t th button.lnk{background:none;border:0;padding:0;cursor:pointer;color:var(--phase);font:inherit;text-align:left;text-decoration:underline;text-underline-offset:2px}
.empty{padding:18px;color:var(--ink-2)}

/* ---------- methodology sections ---------- */
.m-head{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:start;margin-bottom:18px}
.m-num{font-family:var(--font-head);font-weight:700;font-size:2.6rem;line-height:.9;color:var(--phase);min-width:1.1em}
.m-alias{color:var(--ink-2);font-size:.92rem;margin-top:6px}
.m-strip{grid-column:2;display:flex;flex-wrap:wrap;gap:6px 22px;font-size:.92rem;margin-top:6px}
.m-strip b{font-weight:700}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin:8px 0 22px;overflow-x:auto;scrollbar-width:thin}
.tab{border:0;background:none;padding:10px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:700;color:var(--ink-2);min-height:44px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--phase)}
.tab:hover{color:var(--ink)}
.kv-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 40px}
.kv-block h3{margin:0 0 8px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
dl.kv{margin:0;display:grid;grid-template-columns:minmax(120px,34%) 1fr}
dl.kv dt{font-weight:700;font-size:.86rem;padding:8px 10px 8px 0;border-bottom:1px solid var(--rule);color:var(--ink-2)}
dl.kv dd{margin:0;padding:8px 0;border-bottom:1px solid var(--rule);font-size:.93rem}
dl.kv dd ul{margin:0;padding-left:1.1em}
.rel-list{list-style:none;margin:0;padding:0}
.rel-list li{padding:9px 0;border-bottom:1px solid var(--rule);font-size:.93rem}
.rel-type{display:inline-block;font-weight:700;font-size:.78rem;padding:2px 7px;border-radius:4px;background:var(--surface-2);margin-right:6px}
.jump{background:none;border:0;padding:0;color:var(--phase);cursor:pointer;font-weight:700;text-decoration:underline;text-underline-offset:2px}

/* ---------- diagrams ---------- */
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.82rem;color:var(--ink-2);margin:0 0 12px;align-items:center}
.legend .lg-node{display:inline-block;width:22px;height:14px;border:1.5px solid var(--k);background:var(--surface);vertical-align:-2px;margin-right:6px;border-radius:3px}
.legend svg{vertical-align:middle;margin-right:6px}
.dg-shell{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:20px;align-items:start}
.dg-scroll{overflow:auto;border:1px solid var(--rule);border-radius:10px;background-color:var(--surface);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;max-width:100%}
.dg-hint{font-size:.8rem;color:var(--ink-2);margin:6px 2px 0}
.dg-canvas{position:relative}
.dg-canvas>svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.e-line{fill:none;stroke-width:1.6}
.e-n{stroke:var(--ink-2)}
.e-fb{stroke:var(--loop);stroke-dasharray:7 4;stroke-width:1.8}
.e-opt{stroke:var(--artifact);stroke-dasharray:2 4;stroke-linecap:round}
.e-lbl{font-family:var(--font-body);font-size:11.5px;fill:var(--ink-2);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.e-lbl.fb{fill:var(--loop)}
.mk-n{fill:var(--ink-2)} .mk-fb{fill:var(--loop)} .mk-opt{fill:var(--artifact)}
.node{position:absolute;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;padding:6px 10px;border:1.5px solid var(--k);background:var(--surface);color:var(--ink);text-align:left;cursor:pointer;border-radius:6px;overflow:hidden}
.node .k{font-size:.66rem;font-weight:700;color:var(--k);line-height:1.2}
.node .t{font-family:var(--font-head);font-weight:600;font-size:.9rem;line-height:1.14;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:100%}
.node .s{font-size:.72rem;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;line-height:1.3}
.node[data-kind="phase"]{--k:var(--phase);border-top-width:4px}
.node[data-kind="decision"]{--k:var(--decision);border-width:2px;border-radius:24px;padding-left:16px;padding-right:16px}
.node[data-kind="output"]{--k:var(--output);border-style:double;border-width:4px}
.node[data-kind="artifact"]{--k:var(--artifact);border-style:dashed;background:var(--surface-2)}
.node[data-kind="input"]{--k:var(--ink);border-left-width:6px}
.node:hover{box-shadow:0 0 0 3px color-mix(in srgb,var(--k) 28%,transparent)}
.node[aria-pressed="true"]{box-shadow:0 0 0 3px var(--k);z-index:2}
.dg-panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px 16px 12px;max-height:calc(100vh - 110px);overflow:auto}
.dg-panel .p-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dg-panel h4{font-size:1.12rem;margin:4px 0 8px}
.dg-panel .p-kind{font-size:.74rem;font-weight:700}
.dg-panel .p-close{border:1px solid var(--rule);background:var(--surface);border-radius:8px;min-width:40px;min-height:40px;cursor:pointer;font-size:1.05rem;flex:none}
.dg-panel dl{margin:0}
.dg-panel dt{font-weight:700;font-size:.78rem;color:var(--ink-2);margin-top:10px}
.dg-panel dd{margin:2px 0 0;font-size:.9rem}
.dg-panel .p-empty{color:var(--ink-2);font-size:.92rem}
.dg-text{margin-top:14px;font-size:.9rem}
.dg-text summary{cursor:pointer;font-weight:700;padding:6px 0}
.dg-text ol{margin:6px 0 0;padding-left:1.3em}
.dg-text li{margin:3px 0}

/* ---------- examples / links / structure ---------- */
.ex-list{list-style:none;margin:0 0 26px;padding:0;display:grid;gap:0}
.ex-list li{padding:14px 0;border-bottom:1px solid var(--rule)}
.ex-list li:first-child{border-top:1px solid var(--rule)}
.ex-top{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.ex-top h4{font-size:1.02rem}
.ev{display:inline-block;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:999px;border:1.5px solid}
.ev-explicit{color:var(--output)} .ev-strong{color:var(--phase)} .ev-related{color:var(--decision)} .ev-conceptual{color:var(--artifact);border-style:dashed}
.ex-rel{font-size:.9rem;margin:4px 0}
.ex-desc{font-size:.92rem;color:var(--ink-2);margin:2px 0}
.ex-links{font-size:.88rem;display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:4px}
.link-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px 28px}
.link-groups h4{padding-bottom:6px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.link-groups ul{list-style:none;margin:0;padding:0}
.link-groups li{padding:8px 0;border-bottom:1px solid var(--rule);font-size:.9rem}
.link-groups .dom{color:var(--ink-2);font-size:.8rem}
.tree-box{position:relative;margin-bottom:22px}
.tree-box pre{margin:0;padding:16px 18px;background:var(--surface);border:1px solid var(--rule);border-radius:10px;overflow:auto;font-size:.84rem;line-height:1.5}
.tree-box .btn{position:absolute;right:10px;top:10px}
.copy-status{font-size:.82rem;color:var(--output);min-height:1.2em;margin-top:4px}
.st{display:inline-block;font-size:.74rem;font-weight:700;padding:2px 7px;border-radius:4px;white-space:nowrap}
.st-mandatory,.st-req{background:var(--ink);color:var(--surface)}
.st-optional,.st-opt{border:1px dashed var(--ink-2);color:var(--ink-2)}
.st-contextual,.st-compat{border:1.5px solid var(--phase);color:var(--phase)}
.note{font-size:.88rem;color:var(--ink-2);margin:0 0 12px;max-width:80ch}

/* ---------- relationship map ---------- */
.rm-shell{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.rm-scroll{overflow:auto;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
.rm-canvas{position:relative}
.rm-canvas>svg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.rm-node{position:absolute;border:2px solid var(--ink);background:var(--surface);border-radius:8px;padding:6px 10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:center}
.rm-node .n{font-family:var(--font-head);font-weight:700;color:var(--phase);font-size:.82rem}
.rm-node .t{font-family:var(--font-head);font-weight:600;font-size:.92rem;line-height:1.12}
.rm-node[data-level="runtime"]{border-style:dashed}
.rm-node[data-level="integrated"]{border-width:3px;border-style:double}
.rm-node[aria-pressed="true"]{box-shadow:0 0 0 3px var(--phase)}
.rm-node.faded{opacity:.35}
.r-e{fill:none}
.r-e.faded{opacity:.12}
.r-extends{stroke:var(--phase);stroke-width:2.6}
.r-orchestrates{stroke:var(--decision);stroke-width:2.1;stroke-dasharray:9 4}
.r-uses{stroke:var(--artifact);stroke-width:1.9;stroke-dasharray:3 3}
.r-feeds{stroke:var(--output);stroke-width:2.3}

function rich(str){
  let h = esc(str);
  h = h.replace(/\{(GR|INT|EX|EXT)\}/g, (m,t) => pv(t));
  h = h.replace(/\[@([a-z0-9-]+)\]/g, (m,k) => cite(k));
  h = h.replace(/~([^~]+?)~/g, "<sub>$1</sub>");
  return h;
}
function plain(str){
  return String(str ?? "").replace(/\{(GR|INT|EX|EXT)\}/g,"")
    .replace(/\[@([a-z0-9-]+)\]/g,(m,k)=> SRC[k] ? `[${SRC[k].n}]` : "")
    .replace(/~([^~]+?)~/g,"$1").replace(/\s+/g," ").trim();
}
function withInt(s){ return /\{(GR|INT|EX|EXT)\}|\[@/.test(s) ? s : s + " {INT}"; }
function domainOf(u){ try { return new URL(u).hostname.replace(/^www\./,""); } catch(e){ return ""; } }
function srcLink(k, label){ const s = SRC[k]; return s ? `<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(label || s.t)}</a>` : ""; }
function mLabel(id){ const m = MAP[id]; return m ? (m.n === "∑" ? m.short : `${m.n}. ${m.short}`) : id; }
function jumpBtn(id){ return `<button type="button" class="jump" data-go="${id}">${esc(mLabel(id))}</button>`; }
const KINDS = { input:["▶","Input"], phase:["■","Phase"], decision:["◆","Decision"], output:["●","Output"], artifact:["▣","Artifact / tool"] };
const STATUS = { req:"Required by methodology", compat:"Commonly compatible", opt:"Optional tooling", mandatory:"Mandatory", optional:"Optional", contextual:"Contextual" };

/* ---------- diagrams ---------- */
const DG = { COLW:184, ROWH:114, NW:160, NH:82, PADX:64, PADY:30 };
function nodeBox(n){ return { x: DG.PADX + n.c*DG.COLW + (DG.COLW-DG.NW)/2, y: DG.PADY + n.r*DG.ROWH + (DG.ROWH-DG.NH)/2, w: DG.NW, h: DG.NH }; }
function edgeObj(e){ return { from:e[0], to:e[1], label:e[2]||"", style:e[3]||"n", route:e[4]||"auto" }; }
function routeEdge(A, B, a, b, e, lane, cols){
  const acx=A.x+A.w/2, acy=A.y+A.h/2, bcx=B.x+B.w/2, bcy=B.y+B.h/2;
  const r = e.route;
  if(r==="side-right"){ const lx=DG.PADX+(cols||3)*DG.COLW+4+lane*14; return {pts:[[A.x+A.w,acy],[lx,acy],[lx,bcy],[B.x+B.w,bcy]], lane:"v"}; }
  if(r==="side-left"){ const lx=DG.PADX-4-lane*14; return {pts:[[A.x,acy],[lx,acy],[lx,bcy],[B.x,bcy]], lane:"v"}; }
  if(r==="under"){ const ly=Math.max(A.y+A.h,B.y+B.h)+22+lane*14; return {pts:[[acx,A.y+A.h],[acx,ly],[bcx,ly],[bcx,B.y+B.h]], lane:"h-under"}; }
  if(r==="over"){ const ly=Math.min(A.y,B.y)-16-lane*12; return {pts:[[acx,A.y],[acx,ly],[bcx,ly],[bcx,B.y]], lane:"h-over"}; }
  if(b.r>a.r){ const my=(A.y+A.h+B.y)/2; return {pts: a.c===b.c ? [[acx,A.y+A.h],[bcx,B.y]] : [[acx,A.y+A.h],[acx,my],[bcx,my],[bcx,B.y]]}; }
  if(b.r<a.r){ const my=(B.y+B.h+A.y)/2; return {pts: a.c===b.c ? [[acx,A.y],[bcx,B.y+B.h]] : [[acx,A.y],[acx,my],[bcx,my],[bcx,B.y+B.h]]}; }
  return {pts: b.c>a.c ? [[A.x+A.w,acy],[B.x,bcy]] : [[A.x,acy],[B.x+B.w,bcy]]};
}
function labelSVG(route, text, cls){
  if(!text) return "";
  const p = route.pts; let best=0, bi=0;
  for(let i=0;i<p.length-1;i++){ const L=Math.hypot(p[i+1][0]-p[i][0],p[i+1][1]-p[i][1]); if(L>best){best=L;bi=i;} }
  const [x1,y1]=p[bi], [x2,y2]=p[bi+1]; const mx=(x1+x2)/2, my=(y1+y2)/2;
  const raw = plain(text), t = esc(raw), tw = raw.length*6.3 + 4;
  if(x1===x2){
    if(route.lane==="v"){ if(best < tw) return ""; return `<text class="e-lbl ${cls}" x="${mx}" y="${my}" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 ${mx} ${my})">${t}</text>`; }
    return `<text class="e-lbl ${cls}" x="${mx+6}" y="${my+4}" text-anchor="start">${t}</text>`;
  }
  if(best < tw) return "";
  return `<text class="e-lbl ${cls}" x="${mx}" y="${my}" text-anchor="middle" dominant-baseline="central">${t}</text>`;
}
function diagramHTML(m){
  const d = m.diagram;
  const hasUnder = d.edges.some(e=>e[4]==="under");
  const W = DG.PADX*2 + d.cols*DG.COLW, H = DG.PADY*2 + d.rows*DG.ROWH + (hasUnder?34:0);
  const byId = {}; d.nodes.forEach(n=>byId[n.id]=n);
  const laneCount = {};
  let paths = "", labels = "";
  d.edges.map(edgeObj).forEach(e => {
    const a=byId[e.from], b=byId[e.to]; if(!a||!b) return;
    const lane = laneCount[e.route] = (laneCount[e.route] ?? -1) + 1;
    const rt = routeEdge(nodeBox(a), nodeBox(b), a, b, e, e.route==="auto"?0:lane, d.cols);
    const dpath = rt.pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
    const cls = e.style==="fb"?"e-fb":e.style==="opt"?"e-opt":"e-n";
    paths += `<path class="e-line ${cls}" d="${dpath}" marker-end="url(#mk-${e.style})"/>`;
    labels += labelSVG(rt, e.label, e.style==="fb"?"fb":"");
  });
  const nodes = d.nodes.map(n => {
    const b = nodeBox(n); const [g,kl] = KINDS[n.k];
    return `<button type="button" class="node" data-kind="${n.k}" data-mid="${m.id}" data-node="${n.id}" style="left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px" aria-pressed="false" aria-controls="${m.id}-panel" aria-label="${esc(kl)}: ${esc(plain(n.t))}. ${esc(plain(n.s))}" title="${esc(plain(n.s))}"><span class="k" aria-hidden="true">${g} ${kl}</span><span class="t" aria-hidden="true">${rich(n.t)}</span><span class="s" aria-hidden="true">${rich(n.s)}</span></button>`;
  }).join("");
  const textList = d.nodes.map(n => {
    const out = d.edges.map(edgeObj).filter(e=>e.from===n.id).map(e=>`${esc(plain(byId[e.to].t))}${e.label?` (${esc(plain(e.label))})`:""}${e.style==="fb"?" — feedback":""}`);
    return `<li><b>${KINDS[n.k][1]}: ${esc(plain(n.t))}</b> — ${esc(plain(n.s))}.${out.length?` Leads to: ${out.join("; ")}.`:""}</li>`;
  }).join("");
  return `
    <p class="note">${rich("Flow as defined in the golden reference {GR}; supporting blocks and gates marked in each block’s details.")} Hover, focus or select a block to inspect it. Arrow keys follow the connections.</p>
    ${legendHTML()}
    <div class="dg-shell">
      <div>
        <div class="dg-scroll" id="${m.id}-scroll">
          <div class="dg-canvas" role="group" aria-label="Flow diagram: ${esc(m.name)}" style="width:${W}px;height:${H}px">
            <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true" focusable="false">${paths}${labels}</svg>
            ${nodes}
          </div>
        </div>
        <p class="dg-hint" id="${m.id}-hint" hidden>Scroll sideways to see the whole diagram.</p>
        <details class="dg-text"><summary>Diagram as text</summary><ol>${textList}</ol></details>
      </div>
      <aside class="dg-panel" id="${m.id}-panel" aria-label="Block details for ${esc(m.short)}"></aside>
    </div>
    <p class="vh" aria-live="polite" id="${m.id}-live"></p>`;
}
function legendHTML(){
  const nodeSw = (k,l,extra="") => `<span><span class="lg-node" style="--k:var(--${k==="input"?"ink":k});${extra}"></span>${l}</span>`;

function adjacency(m, id){
  const d = m.diagram, byId={}; d.nodes.forEach(n=>byId[n.id]=n);
  const es = d.edges.map(edgeObj); const parts=[];
  const fmt = (e, other) => `${esc(plain(byId[other].t))}${e.label?` <span class="note">(${esc(plain(e.label))})</span>`:""}`;
  const inN = es.filter(e=>e.to===id && e.style!=="fb"), outN = es.filter(e=>e.from===id && e.style!=="fb");
  const inF = es.filter(e=>e.to===id && e.style==="fb"), outF = es.filter(e=>e.from===id && e.style==="fb");
  if(inN.length) parts.push(`<b>Receives from:</b> ${inN.map(e=>fmt(e,e.from)).join("; ")}`);
  if(outN.length) parts.push(`<b>Leads to:</b> ${outN.map(e=>fmt(e,e.to)).join("; ")}`);
  if(outF.length) parts.push(`<b>Loops back to:</b> ${outF.map(e=>fmt(e,e.to)).join("; ")}`);
  if(inF.length) parts.push(`<b>Receives feedback from:</b> ${inF.map(e=>fmt(e,e.from)).join("; ")}`);
  return parts.join("<br>") || "Stands alone.";
}

function neighbour(mid, id, forward){
  const es = MAP[mid].diagram.edges.map(edgeObj);
  const cand = forward ? es.filter(e=>e.from===id).sort((a,b)=>(a.style==="fb")-(b.style==="fb")).map(e=>e.to)
                       : es.filter(e=>e.to===id).sort((a,b)=>(a.style==="fb")-(b.style==="fb")).map(e=>e.from);
  return cand[0];
}

/* ---------- relationship map ---------- */
function rmCenter(id){ const [x,y] = RM_POS[id]; return [x+RM_W/2, y+RM_H/2]; }
function clipRect(cx, cy, dx, dy){
  const hw = RM_W/2+5, hh = RM_H/2+5;
  const t = Math.min(dx ? hw/Math.abs(dx) : Infinity, dy ? hh/Math.abs(dy) : Infinity);
  return [cx+dx*t, cy+dy*t];
}
function rmGeometry(r){
  const [ax,ay] = rmCenter(r[0]), [bx,by] = rmCenter(r[1]); const bend = r[5]||0;
  if(!bend){ const s = clipRect(ax,ay,bx-ax,by-ay), e = clipRect(bx,by,ax-bx,ay-by); return { d:`M${s[0].toFixed(1)},${s[1].toFixed(1)} L${e[0].toFixed(1)},${e[1].toFixed(1)}`, lx:(s[0]+e[0])/2, ly:(s[1]+e[1])/2, pts:[s,e] }; }
  const mx=(ax+bx)/2, my=(ay+by)/2, L=Math.hypot(bx-ax,by-ay)||1; const px=-(by-ay)/L, py=(bx-ax)/L;
  const cx=mx+px*bend, cy=my+py*bend;
  const s = clipRect(ax,ay,cx-ax,cy-ay), e = clipRect(bx,by,cx-bx,cy-by);
  return { d:`M${s[0].toFixed(1)},${s[1].toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${e[0].toFixed(1)},${e[1].toFixed(1)}`, lx:.25*s[0]+.5*cx+.25*e[0], ly:.25*s[1]+.5*cy+.25*e[1], q:[s,[cx,cy],e] };
}
function relSample(t){
  const tt = REL_TYPES[t];
  return `<svg width="38" height="10" aria-hidden="true"><path d="M1,5 L${tt.arrow?30:37},5" class="r-e r-${t}" ${tt.arrow?`marker-end="url(#mk-${t})"`:""}/></svg>`;
}
function renderRelMap(){
  const edges = RELS.map((r,i) => {
    const g = rmGeometry(r); const tt = REL_TYPES[r[2]];
    return `<path class="r-e r-${r[2]}" data-i="${i}" data-from="${r[0]}" data-to="${r[1]}" data-type="${r[2]}" d="${g.d}" ${tt.arrow?`marker-end="url(#mk-${r[2]})"`:""}/>`;
  }).join("");
  const labels = RELS.map((r,i) => { const g = rmGeometry(r); return `<text class="r-lbl" data-li="${i}" x="${g.lx.toFixed(1)}" y="${(g.ly-4).toFixed(1)}" text-anchor="middle" visibility="hidden">${esc(REL_TYPES[r[2]].label)}</text>`; }).join("");
  const nodes = METHODS.map(m => { const [x,y]=RM_POS[m.id]; return `<button type="button" class="rm-node" data-rm="${m.id}" data-level="${m.level}" aria-pressed="false" style="left:${x}px;top:${y}px;width:${RM_W}px;height:${RM_H}px"><span class="n">${m.n==="∑"?"Integrated":"Methodology "+m.n}</span><span class="t">${esc(m.short)}</span></button>`; }).join("");
  $("#relmap").innerHTML = `
    <div class="sec-head"><h2 id="h-relmap">Methodology relationship map</h2></div>
    <p class="sec-intro">How the methodologies coexist: alternatives, overlaps, upstream/downstream links and lifecycle integration. Select a methodology to highlight its relationships and read why each exists. Solid outlines are design or evaluation methodologies, dashed outlines are runtime, and the double outline is the integrated framework.</p>
    <fieldset style="border:0;padding:0;margin:0"><legend class="vh">Relationship types to show</legend><div class="chips" id="relChips">${
      Object.entries(REL_TYPES).map(([k,v])=>`<label class="chip"><input type="checkbox" data-rel="${k}" checked> ${relSample(k)} ${esc(v.label)} <span class="note" style="margin:0">(${esc(v.vocab)})</span></label>`).join("")}</div></fieldset>
    <div class="rm-shell">
      <div class="rm-scroll"><div class="rm-canvas" role="group" aria-label="Relationship map" style="width:${RM_CW}px;height:${RM_CH}px">
        <svg width="${RM_CW}" height="${RM_CH}" viewBox="0 0 ${RM_CW} ${RM_CH}" aria-hidden="true" focusable="false">${edges}${labels}</svg>${nodes}
      </div></div>
      <aside class="rm-panel" id="rmPanel" aria-live="polite"></aside>
    </div>`;
  rmSelect(null);

function rmSelect(id){
  state.rmSel = id;
  $$(".rm-node").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.rm===id)));
  const connected = new Set([id]);
  RELS.forEach((r,i) => {
    const typeOn = state.relTypes.has(r[2]);
    const on = typeOn && (!id || r[0]===id || r[1]===id);
    if(on && id){ connected.add(r[0]); connected.add(r[1]); }
    const p = $(`#relmap path[data-i="${i}"]`); if(p){ p.style.display = typeOn ? "" : "none"; p.classList.toggle("faded", !!id && !on); }
    const t = $(`#relmap text[data-li="${i}"]`); if(t) t.setAttribute("visibility", id && on ? "visible" : "hidden");
  });
  $$(".rm-node").forEach(b => b.classList.toggle("faded", !!id && !connected.has(b.dataset.rm)));
  const panel = $("#rmPanel");
  if(!id){
    panel.innerHTML = `<h3 style="margin-bottom:6px">Select a methodology</h3><p class="p-empty" style="color:var(--ink-2);font-size:.92rem">Its relationships will be highlighted and explained here. ${pv("GR")} marks relationships stated in the reference; ${pv("INT")} marks the atlas’s interpretation.</p><p class="note">Reading the map: arrows point from the methodology that acts (extends, orchestrates, uses, feeds, integrates) to the one acted on. Overlaps and orthogonal links have no direction.</p>`;
    return;
  }
  const m = MAP[id];
  const items = RELS.filter(r => (r[0]===id || r[1]===id) && state.relTypes.has(r[2])).map(r => {
    const other = r[0]===id ? r[1] : r[0]; const tt = REL_TYPES[r[2]];
    const dir = tt.arrow ? (r[0]===id ? `${esc(tt.label)} →` : `← ${esc(tt.label)} (from)`) : esc(tt.label);
    return `<li>${relSample(r[2])} <b>${dir}</b> ${jumpBtn(other)} ${pv(r[3])}<br>${rich(r[4])}</li>`;
  }).join("");
  panel.innerHTML = `<h3 style="margin-bottom:4px">${esc(m.name)}</h3><p class="note">${LEVELS[m.level].label}. <button type="button" class="jump" data-go="${id}">Open section</button></p><ul>${items || `<li>No relationships of the selected types.</li>`}</ul>`;
}

/* ---------- search ---------- */
let INDEX = [];
function buildIndex(){
  const FIELDS = [["name","Name"],["alias","Taxonomy name"],["role","AI role"],["app","Typical application"],["type","Type"],["origin","Origin"],["purpose","Purpose"],["scope","Scope"],["lifecycle","Lifecycle"],["philosophy","Philosophy"],["validation","Validation"],["experimentation","Experimentation"],["documentation","Documentation"],["governance","Governance"],["deployment","Deployment"],["reproducibility","Reproducibility"],["fits","Best fit"],["notfits","Does not fit"],["limitations","Limitations"],["strengths","Strengths"],["constraints","Constraints"]];
  METHODS.forEach(m => {
    FIELDS.forEach(([k,l]) => INDEX.push({ mid:m.id, tab:"ov", label:l, head:m.short, text:plain(m[k]), boost:k==="name"||k==="alias"?3:1 }));
    INDEX.push({ mid:m.id, tab:"ov", label:"Principles", head:m.short, text:plain(m.principles.join(" ")) });
    m.diagram.nodes.forEach(n => INDEX.push({ mid:m.id, tab:"fl", node:n.id, label:`${KINDS[n.k][1]}: ${plain(n.t)}`, head:m.short, text:plain([n.t,n.s,...Object.values(n.d)].join(" ")), boost:2 }));
    m.examples.forEach(x => INDEX.push({ mid:m.id, tab:"ex", label:"Example", head:`${m.short} — ${x.name}`, text:plain(x.name+" "+x.rel+" "+x.desc), boost:2 }));
    m.tools.forEach(t => INDEX.push({ mid:m.id, tab:"tl", label:`Tools: ${t[0]}`, head:m.short, text:plain(t.join(" ")) }));
    m.folders.forEach(f => INDEX.push({ mid:m.id, tab:"st", label:`Folder: ${f[0]}`, head:m.short, text:plain(f.join(" ")) }));
    m.files.forEach(f => INDEX.push({ mid:m.id, tab:"st", label:`File: ${f[0]}`, head:m.short, text:plain(f.join(" ")) }));
  });
  SOURCES.forEach(s => INDEX.push({ sec:"src-"+s.k, label:`Source [${s.n}]`, head:s.t, text:plain(s.t+" "+s.pub+" "+s.type) }));
  HYBRIDS.forEach(h => INDEX.push({ sec:"hy-"+h.id, label:"Hybrid workflow", head:h.title, text:plain([h.title,h.why,h.overlap,h.complement,h.conflict].join(" ")) }));
  NOTES.forEach(n => INDEX.push({ sec:"evidence", label:"Evidence note", head:n.title, text:plain(n.title+" "+n.body) }));
}
function reEsc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
let lastResults = [];
function runSearch(q){
  const box = $("#results"), input = $("#q"), live = $("#resultsLive");
  const toks = q.toLowerCase().split(/\s+/).filter(Boolean);
  if(!toks.length){ box.hidden = true; input.setAttribute("aria-expanded","false"); live.textContent=""; return; }
  const scored = INDEX.map(e => { const hay = (e.head+" "+e.label+" "+e.text).toLowerCase(); if(!toks.every(t=>hay.includes(t))) return null;
    let sc = 0; toks.forEach(t => { sc += (hay.split(t).length-1); if((e.head+" "+e.label).toLowerCase().includes(t)) sc += 4; }); return [sc*(e.boost||1), e]; })
    .filter(Boolean).sort((a,b)=>b[0]-a[0]).slice(0,14).map(x=>x[1]);
  lastResults = scored;
  const hl = s => { let h = esc(s); toks.forEach(t => { h = h.replace(new RegExp(`(${reEsc(esc(t))})`,"gi"),"<mark>$1</mark>"); }); return h; };
  box.innerHTML = scored.length ? scored.map((e,i) => {
    const low = e.text.toLowerCase(); const at = Math.max(0, low.indexOf(toks[0]) - 50);
    const snip = (at>0?"…":"") + e.text.slice(at, at+150) + (e.text.length>at+150?"…":"");
    return `<button type="button" data-ri="${i}"><span class="r-h">${hl(e.head)}</span> <span class="r-f">${esc(e.label)}</span><span class="r-s">${hl(snip)}</span></button>`;
  }).join("") : `<p class="r-empty">No matches for “${esc(q)}”. Try a phase name, a tool such as GNU Radio, or a metric such as SNR.</p>`;
  box.hidden = false; input.setAttribute("aria-expanded","true");
  live.textContent = scored.length ? `${scored.length} results` : "No results";
}
function closeSearch(){ $("#results").hidden = true; $("#q").setAttribute("aria-expanded","false"); }
function goTo(e){
  closeSearch(); closeNav();
  if(e.mid){
    const m = MAP[e.mid];
    if(!state.levels.has(m.level)){ Object.keys(LEVELS).forEach(k=>state.levels.add(k)); $$("#levelChips input").forEach(i=>i.checked=true); applyLevelFilter(); }
    if(e.tab) activateTab(e.mid, e.tab);
    if(e.node) setPinned(e.mid, e.node, true);
    const h2 = document.getElementById("h-"+e.mid); if(h2) h2.setAttribute("tabindex","-1");
    const target = e.node ? $(`.node[data-mid="${e.mid}"][data-node="${e.node}"]`) : e.tab ? document.getElementById(`${e.mid}-tab-${e.tab}`) : h2;
    const sec = document.getElementById(e.mid); if(sec && sec.scrollIntoView) sec.scrollIntoView({block:"start"});
    if(target) setTimeout(()=>target.focus({preventScroll:true}), 60);
  } else if(e.sec){
    const el = document.getElementById(e.sec); if(el){ if(el.scrollIntoView) el.scrollIntoView({block:"center"}); el.setAttribute("tabindex","-1"); el.focus({preventScroll:true}); }
  }
}

/* ---------- theme, nav drawer ---------- */
function effectiveDark(){ const t = document.documentElement.getAttribute("data-theme"); return t ? t==="dark" : mq("(prefers-color-scheme: dark)"); }
function syncThemeBtn(){ $("#themeBtn").setAttribute("aria-pressed", String(effectiveDark())); }
function initTheme(){
  let saved = null; try { saved = localStorage.getItem("sdr-atlas-theme"); } catch(e) {}
  if(saved==="dark"||saved==="light") document.documentElement.setAttribute("data-theme", saved);
  syncThemeBtn();
  $("#themeBtn").addEventListener("click", () => {
    const next = effectiveDark() ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("sdr-atlas-theme", next); } catch(e) {}
    syncThemeBtn();
  });
}
function openNav(){ $("#sidebar").classList.add("open"); $("#scrim").hidden=false; $("#menuBtn").setAttribute("aria-expanded","true"); const a=$("#nav a"); if(a) a.focus(); }
function closeNav(){ if(!$("#sidebar").classList.contains("open")) return; $("#sidebar").classList.remove("open"); $("#scrim").hidden=true; $("#menuBtn").setAttribute("aria-expanded","false"); }

/* ---------- copy ---------- */
async function copyText(text, status){
  let ok = false;
  try { if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); ok = true; } } catch(e) {}
  if(!ok){
    const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0"; ta.style.top="0";
    document.body.appendChild(ta); ta.select(); try { ok = document.execCommand("copy"); } catch(e) {} ta.remove();
  }
  status.textContent = ok ? "Copied to clipboard." : "Copy did not work here. Select the tree text and copy it manually.";
  setTimeout(() => { status.textContent = ""; }, 3500);
}

/* ---------- events ---------- */
function bindEvents(){
  document.addEventListener("click", ev => {
    const t = ev.target;
    const citeBtn = t.closest(".cite[data-src]"); if(citeBtn){ ev.preventDefault(); ev.stopPropagation(); openPop(citeBtn); return; }
    if(t.closest(".popover .x")){ closePop(true); return; }
    if(!t.closest("#popover")) closePop(false);
    const go = t.closest("[data-go]"); if(go){ goTo({ mid:go.dataset.go }); return; }
    const navM = t.closest("#nav a[data-mid]"); if(navM){ ev.preventDefault(); goTo({ mid:navM.dataset.mid }); return; }
    const tab = t.closest('[role="tab"][data-mid]'); if(tab){ activateTab(tab.dataset.mid, tab.dataset.tab); return; }
    const node = t.closest(".node[data-node]"); if(node){ setPinned(node.dataset.mid, node.dataset.node, true); return; }
    const cl = t.closest("[data-close]"); if(cl){ closePanel(cl.dataset.close); return; }
    const cp = t.closest("[data-copy]"); if(cp){ copyText(MAP[cp.dataset.copy].tree, document.getElementById(cp.dataset.copy+"-copy")); return; }
    const rm = t.closest(".rm-node"); if(rm){ rmSelect(state.rmSel===rm.dataset.rm ? null : rm.dataset.rm); return; }
    const rr = t.closest("#results button[data-ri]"); if(rr){ goTo(lastResults[+rr.dataset.ri]); return; }
    if(!t.closest(".search")) closeSearch();
    if(t.closest("#menuBtn")){ $("#sidebar").classList.contains("open") ? closeNav() : openNav(); return; }
    if(t.closest("#scrim")) closeNav();
    if(t.closest("#nav a")) closeNav();
  });
  document.addEventListener("change", ev => {
    const i = ev.target;
    if(i.dataset.level){ i.checked ? state.levels.add(i.dataset.level) : state.levels.delete(i.dataset.level); applyLevelFilter(); }
    else if(i.dataset.cmp){ i.checked ? state.cmp.add(i.dataset.cmp) : state.cmp.delete(i.dataset.cmp); renderCompare(); }
    else if(i.dataset.ev){ i.checked ? state.ev.add(i.dataset.ev) : state.ev.delete(i.dataset.ev); renderProjTable(); }
    else if(i.dataset.rel){ i.checked ? state.relTypes.add(i.dataset.rel) : state.relTypes.delete(i.dataset.rel); rmSelect(state.rmSel); }
  });
  // hover and focus previews on diagram blocks (desktop); touch uses click
  document.addEventListener("mouseover", ev => { const n = ev.target.closest && ev.target.closest(".node[data-node]"); if(n && canHover()) showNode(n.dataset.mid, n.dataset.node); });
  document.addEventListener("mouseout", ev => { const n = ev.target.closest && ev.target.closest(".node[data-node]"); if(n && canHover() && !(ev.relatedTarget && n.contains(ev.relatedTarget))) showNode(n.dataset.mid, state.diagrams[n.dataset.mid].pinned); });
  document.addEventListener("focusin", ev => { const n = ev.target.closest && ev.target.closest(".node[data-node]"); if(n && !isDrawerMode()) showNode(n.dataset.mid, n.dataset.node); });
  document.addEventListener("focusout", ev => { const n = ev.target.closest && ev.target.closest(".node[data-node]"); if(n && !isDrawerMode() && !(ev.relatedTarget && ev.relatedTarget.closest && ev.relatedTarget.closest(".node"))) showNode(n.dataset.mid, state.diagrams[n.dataset.mid].pinned); });
  document.addEventListener("keydown", ev => {
    const t = ev.target;
    if(ev.key === "Escape"){
      if(!$("#popover").hidden){ closePop(true); return; }
      if(!$("#results").hidden){ closeSearch(); $("#q").focus(); return; }
      const open = $(".dg-panel.open"); if(open){ closePanel(open.id.replace("-panel","")); return; }
      closeNav(); return;
    }
    if(t.matches && t.matches('[role="tab"]')){
      const tabs = $$(`[role="tab"][data-mid="${t.dataset.mid}"]`); let i = tabs.indexOf(t);
      if(ev.key==="ArrowRight"){ i=(i+1)%tabs.length; } else if(ev.key==="ArrowLeft"){ i=(i-1+tabs.length)%tabs.length; } else if(ev.key==="Home"){ i=0; } else if(ev.key==="End"){ i=tabs.length-1; } else return;
      ev.preventDefault(); activateTab(t.dataset.mid, tabs[i].dataset.tab, true); return;
    }
    if(t.matches && t.matches(".node[data-node]")){
      const fwd = ev.key==="ArrowDown"||ev.key==="ArrowRight", back = ev.key==="ArrowUp"||ev.key==="ArrowLeft";
      if(!fwd && !back) return;
      const nb = neighbour(t.dataset.mid, t.dataset.node, fwd);
      if(nb){ ev.preventDefault(); const b = $(`.node[data-mid="${t.dataset.mid}"][data-node="${nb}"]`); if(b) b.focus(); }
      return;
    }
    if(t.id==="q" && ev.key==="ArrowDown"){ const f = $("#results button"); if(f){ ev.preventDefault(); f.focus(); } return; }
    if(t.closest && t.closest("#results") && (ev.key==="ArrowDown"||ev.key==="ArrowUp")){
      const bs = $$("#results button"); let i = bs.indexOf(t); i += ev.key==="ArrowDown"?1:-1;
      ev.preventDefault(); if(i<0) $("#q").focus(); else if(bs[i]) bs[i].focus();
    }
  });
  let timer = null;
  $("#q").addEventListener("input", ev => { clearTimeout(timer); timer = setTimeout(()=>runSearch(ev.target.value), 120); });
  $("#q").addEventListener("focus", ev => { if(ev.target.value.trim()) runSearch(ev.target.value); });
  window.addEventListener("resize", () => { METHODS.forEach(m => updateHint(m.id)); if(!isDrawerMode()) $$(".dg-panel.open").forEach(p=>p.classList.remove("open")); });
  if("IntersectionObserver" in window){
    const links = {}; $$("#nav a[data-sec]").forEach(a => links[a.dataset.sec] = a);
    const io = new IntersectionObserver(entries => {
      entries.forEach(en => { if(en.isIntersecting){ Object.values(links).forEach(a=>a.removeAttribute("aria-current")); const a = links[en.target.id]; if(a) a.setAttribute("aria-current","true"); } });
    }, { rootMargin:"-40% 0px -55% 0px" });
    Object.keys(links).forEach(id => { const el = document.getElementById(id); if(el) io.observe(el); });
  }
}

function boot(){
  renderNav(); renderHero(); renderLandscape(); renderComparison(); renderCompareSection();
  renderMethods(); renderProjects(); renderRelMap(); renderHybrids(); renderEvidence(); renderSources();
  buildIndex(); initTheme(); bindEvents(); applyLevelFilter();
}
boot();
